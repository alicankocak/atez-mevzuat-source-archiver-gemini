name: ATEZ Mevzuat Kaynak Arşivleme

on:
  schedule:
    # 05:00 TSI (Europe/Istanbul UTC+3 -> 02:00 UTC)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Arşivlenecek Tarih (DD.MM.YYYY veya YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  archive-sources:
    # Yalnızca self-hosted macOS runner üzerinde çalışır
    runs-on: [self-hosted, macOS]

    steps:
      - name: Checkout Depo
        uses: actions/checkout@v4

      - name: Python Ortamını Hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Hedef Tarihi Belirle
        id: determine_date
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPORT_DATE_INPUT: ${{ github.event.inputs.report_date }}
        run: |
          python3 - <<'PY'
          import datetime
          import os
          import re
          from pathlib import Path

          report_date = (
              os.environ.get("REPORT_DATE_INPUT", "")
              if os.environ.get("EVENT_NAME") == "workflow_dispatch"
              else ""
          )
          if report_date:
              try:
                  if re.fullmatch(r"\d{4}-\d{2}-\d{2}", report_date):
                      datetime.date.fromisoformat(report_date)
                  elif re.fullmatch(r"\d{2}\.\d{2}\.\d{4}", report_date):
                      datetime.datetime.strptime(report_date, "%d.%m.%Y")
                  else:
                      raise ValueError
              except ValueError as error:
                  raise SystemExit(
                      "report_date DD.MM.YYYY veya YYYY-MM-DD biçiminde "
                      "geçerli bir takvim tarihi olmalıdır"
                  ) from error

          delimiter = "ATEZ_TARGET_DATE_EOF"
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env_file:
              env_file.write(f"TARGET_DATE<<{delimiter}\n")
              env_file.write(f"{report_date}\n")
              env_file.write(f"{delimiter}\n")
          PY

      - name: Kaynakları İndir ve Google Drive'a Doğrulanmış Olarak Yükle
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_ROOT_FOLDER_ID: ${{ secrets.DRIVE_ROOT_FOLDER_ID }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python -m src.main --date "$TARGET_DATE"
          else
            python -m src.main
          fi
