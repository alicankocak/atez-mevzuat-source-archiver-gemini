name: ATEZ Mevzuat Kaynak Arşivleme

on:
  schedule:
    # 05:00 TSI (Europe/Istanbul UTC+3 -> 02:00 UTC)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      report_date:
        description: 'Arşivlenecek Tarih (DD.MM.YYYY veya YYYY-MM-DD)'
        required: false
        default: ''
  issues:
    types: [opened]

jobs:
  archive-sources:
    # Yalnızca self-hosted macOS runner üzerinde çalışır
    runs-on: [self-hosted, macOS]
    
    # Issue tetiklendiğinde yetkili kullanıcı ve başlık doğrulaması
    if: |
      github.event_name != 'issues' ||
      (
        (github.event.issue.author_association == 'OWNER' ||
         github.event.issue.author_association == 'MEMBER' ||
         github.event.issue.author_association == 'COLLABORATOR') &&
        startsWith(github.event.issue.title, 'SOURCE_REQUEST —')
      )

    steps:
      - name: Checkout Depo
        uses: actions/checkout@v4

      - name: Python Ortamını Hazırla
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Hedef Tarihi Belirle
        id: determine_date
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.report_date }}" ]; then
            echo "TARGET_DATE=${{ github.event.inputs.report_date }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "issues" ]; then
            # Issue başlığından tarihi çıkar (SOURCE_REQUEST — YYYY-MM-DD)
            ISSUE_DATE=$(echo "${{ github.event.issue.title }}" | sed 's/SOURCE_REQUEST — //')
            echo "TARGET_DATE=$ISSUE_DATE" >> $GITHUB_ENV
          else
            echo "TARGET_DATE=" >> $GITHUB_ENV
          fi

      - name: Kaynakları İndir ve Google Drive'a Doğrulanmış Olarak Yükle
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          DRIVE_ROOT_FOLDER_ID: ${{ secrets.DRIVE_ROOT_FOLDER_ID }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python -m src.main --date "$TARGET_DATE"
          else
            python -m src.main
          fi

      - name: Issue Başarılı Kapatma
        if: github.event_name == 'issues' && success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Kaynaklar başarıyla indirildi, doğrulandı ve Google Drive (`_READY.json`) arşivine yüklendi.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
